upstream backend {
    server host.docker.internal:3000;
}

upstream activepieces {
    server activepieces:80 max_fails=3 fail_timeout=30s;
}

upstream ocr_service {
    server ocr:8002;
}

upstream hs_query {
    # server hs-query-frontend:3001;  # 宸插仠锟?
    server 127.0.0.1:1 down;  # placeholder - disabled
}

# HTTP
server {
    listen 80;
    server_name _;

    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;
    }

    # JS/CSS - 绂佹娴忚鍣ㄧ紦锟?
    location ~* \.(js|css)$ {
        root /usr/share/nginx/html;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        expires 0;
    }

    # 鑷姩鐧诲綍椤甸潰锛氱櫥褰曞悗璺宠浆 dashboard锛堢粫杩囧墠锟?SPA锟?
    location /auto-login {
        add_header Content-Type text/html;
        return 200 '<!DOCTYPE html><html><head><meta charset="utf-8"><title>鑷姩鐧诲綍</title></head><body><h2>姝ｅ湪鑷姩鐧诲綍...</h2><script>var t=localStorage.getItem("token");if(t&&t.length>20){window.location.href="/dashboard"}else{fetch("/api/auth/login",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({email:"test@test.com",password:"123456"})}).then(function(r){return r.json()}).then(function(d){if(d.token){localStorage.setItem("token",d.token);window.location.href="/dashboard"}else{document.body.innerHTML="<h2>鐧诲綍澶辫触: "+JSON.stringify(d)+"</h2>"}}).catch(function(e){document.body.innerHTML="<h2>璇锋眰澶辫触: "+e.message+"</h2>"})}</script></body></html>';
    }

    location /api/ {
        proxy_pass http://backend/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto http;
        proxy_read_timeout 300s;
    }

    location /ocr/ {
        proxy_pass http://ocr_service/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto http;
        proxy_read_timeout 120s;
        client_max_body_size 50m;
    }

    # location /hs-query/ {  # service disabled - merged into main frontend
    #     proxy_pass http://hs_query/;
    #     proxy_set_header Host $host;
    #     proxy_set_header X-Real-IP $remote_addr;
    #     proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    #     proxy_set_header X-Forwarded-Proto http;
    #     proxy_read_timeout 60s;
    # }

    location /external/ {
        proxy_pass http://backend/external/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto http;
    }

    client_max_body_size 50m;
}




