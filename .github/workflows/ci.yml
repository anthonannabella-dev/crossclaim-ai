name: CI

# CrossClaim 持续集成。
# 注意：main 历史上曾包含旧项目内容（见 LEGACY_MIGRATION_AUDIT.md）。
# 本工作流只针对 CrossClaim 正式工程结构。
#
# 关键点：CI 会对一个**全新 PostgreSQL** 执行 prisma migrate deploy，
# 并在该库上跑完整测试（含跨租户隔离等数据库级断言）。
# 「本地通过但 CI 红」不作为完成依据。

on:
  push:
    branches: [main, 'gate/**', 'feat/**', 'fix/**']
  pull_request:
    branches: [main]

env:
  NODE_VERSION: '22'

jobs:
  api:
    name: API · migration + typecheck + tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: crossclaim
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: crossclaim
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U crossclaim -d crossclaim"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    env:
      DATABASE_URL: postgresql://crossclaim:ci@localhost:5432/crossclaim

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: apps/api/package-lock.json

      - name: Install dependencies
        working-directory: apps/api
        run: npm ci --no-audit --no-fund

      - name: Validate Prisma schema
        working-directory: apps/api
        run: npx prisma validate

      - name: Apply migrations to a fresh database
        working-directory: apps/api
        run: npx prisma migrate deploy

      - name: Generate Prisma Client
        working-directory: apps/api
        run: npx prisma generate

      - name: Verify tenant-integrity triggers (name / table / enabled)
        run: |
          PGPASSWORD=ci psql -h localhost -U crossclaim -d crossclaim -v ON_ERROR_STOP=1 <<'SQL'
          DO $$
          DECLARE
            baseline int;
            expected int;
            immutable_ok int;
            ruleset_ok int;
          BEGIN
            SELECT count(*) INTO baseline FROM pg_trigger WHERE NOT tgisinternal AND tgenabled = 'O'
              AND tgname LIKE 'cc_tenant_%' AND tgname NOT LIKE 'cc_tenant_immutable__%';
            IF baseline < 28 THEN RAISE EXCEPTION 'baseline tenant triggers < 28 (got %)', baseline; END IF;
            SELECT count(*) INTO expected FROM information_schema.columns
              WHERE table_schema = current_schema() AND column_name = 'organizationId' AND table_name <> '_prisma_migrations';
            SELECT count(*) INTO immutable_ok
              FROM pg_trigger g
              JOIN pg_class c ON c.oid = g.tgrelid
              JOIN pg_namespace n ON n.oid = c.relnamespace AND n.nspname = current_schema()
              JOIN information_schema.columns ic
                ON ic.table_schema = current_schema() AND ic.table_name = c.relname
               AND ic.column_name = 'organizationId'
              WHERE NOT g.tgisinternal AND g.tgenabled = 'O' AND g.tgname = 'cc_tenant_immutable__' || c.relname;
            IF immutable_ok <> expected THEN
              RAISE EXCEPTION 'immutability triggers incomplete (expected % per-table triggers, found %)', expected, immutable_ok;
            END IF;
            SELECT count(*) INTO ruleset_ok FROM pg_trigger
              WHERE NOT tgisinternal AND tgenabled = 'O' AND tgname = 'cc_ruleset_ownership_immutable';
            IF ruleset_ok <> 1 THEN RAISE EXCEPTION 'RuleSet ownership trigger missing'; END IF;
            RAISE NOTICE 'OK: baseline=% immutable=% ruleset=%', baseline, immutable_ok, ruleset_ok;
          END
          $$;
          SQL
          echo "OK: tenant-integrity triggers verified (baseline>=28, per-table immutability complete, ruleset immutable)"

      - name: API contract (API.md ↔ implemented routes)
        run: node tools/api-contract/check-routes.mjs --root .

      - name: Audit coverage (audit actions ↔ OPERATIONS.md)
        run: node tools/audit-coverage/check-audit-actions.mjs --root .

      - name: TypeScript typecheck
        working-directory: apps/api
        run: npx tsc --noEmit

      - name: Unit + database integration tests
        working-directory: apps/api
        run: npm test

  deploy-smoke:
    name: Deploy smoke · fresh install + migration upgrade
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: apps/api/package-lock.json

      - name: Install dependencies (api)
        working-directory: apps/api
        run: npm ci --no-audit --no-fund

      # P2-1（MSG-20260929-70 D4）：容器化 smoke，只用测试 secret、随机库、结束销毁
      - name: Deployment smoke (docker, fresh install + upgrade)
        run: node tools/smoke/deploy-smoke.mjs

  backup-verify:
    name: Backup restore verify · synthetic dataset
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: apps/api/package-lock.json

      - name: Install dependencies (api)
        working-directory: apps/api
        run: npm ci --no-audit --no-fund

      - name: Generate Prisma Client
        working-directory: apps/api
        run: npx prisma generate

      # P2-2（MSG-20260929-71 Q2）：合成数据 + 临时容器；dump 只在容器内，禁止 upload artifact
      - name: Backup / restore verification (docker, synthetic)
        run: node tools/backup-verify/run-synthetic-backup-verify.mjs

  license-gate:
    name: 许可证闸门
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install dependencies (for scanning)
        working-directory: apps/api
        run: npm ci --no-audit --no-fund

      - name: Install web dependencies (for scanning)
        working-directory: apps/web
        run: npm ci --no-audit --no-fund

      - name: Run license gate
        run: node tools/license-gate/check-licenses.mjs --json tools/license-gate/report.json

      - name: Upload license report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: license-report
          path: tools/license-gate/report.json
          if-no-files-found: ignore

  web:
    name: Web · typecheck + build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Install dependencies
        working-directory: apps/web
        run: npm ci --no-audit --no-fund

      - name: TypeScript typecheck
        working-directory: apps/web
        run: npm run typecheck

      - name: Next.js production build
        working-directory: apps/web
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: '1'
