name: CI

# CrossClaim 持续集成。
# 注意：main 历史上曾包含旧项目内容（见 LEGACY_MIGRATION_AUDIT.md）。
# 本工作流只针对 CrossClaim 正式工程结构。

on:
  push:
    branches: [main, 'gate/**', 'feat/**', 'fix/**']
  pull_request:
    branches: [main]

env:
  NODE_VERSION: '22'

jobs:
  api:
    name: API typecheck and tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: apps/api/package-lock.json

      - name: Install dependencies
        working-directory: apps/api
        run: npm ci --no-audit --no-fund

      - name: Validate Prisma schema
        working-directory: apps/api
        run: npx prisma validate
        env:
          DATABASE_URL: postgresql://crossclaim:ci@localhost:5432/crossclaim

      - name: Generate Prisma Client
        working-directory: apps/api
        run: npx prisma generate
        env:
          DATABASE_URL: postgresql://crossclaim:ci@localhost:5432/crossclaim

      - name: TypeScript typecheck
        working-directory: apps/api
        run: npx tsc --noEmit

      - name: Unit tests
        working-directory: apps/api
        run: npm test
        env:
          DATABASE_URL: postgresql://crossclaim:ci@localhost:5432/crossclaim

  license-gate:
    name: License gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install dependencies (for scanning)
        working-directory: apps/api
        run: npm ci --no-audit --no-fund

      - name: Run license gate
        run: node tools/license-gate/check-licenses.mjs --json tools/license-gate/report.json

      - name: Upload license report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: license-report
          path: tools/license-gate/report.json
          if-no-files-found: ignore
