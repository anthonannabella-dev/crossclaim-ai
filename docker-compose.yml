services:
  postgres:
    image: postgres:16-alpine
    container_name: customs-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-customs}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:-customs_saas}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U customs -d customs_saas"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: customs-redis
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD:?REDIS_PASSWORD is required} --appendonly yes
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:?REDIS_PASSWORD is required}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  seaweedfs:
    image: chrislusf/seaweedfs:latest
    container_name: customs-seaweedfs
    restart: unless-stopped
    command: server -s3 -s3.port=8333 -dir=/data -volume.max=0
    ports:
      - "127.0.0.1:8333:8333"    # S3 兼容 API
      - "127.0.0.1:9333:9333"    # Master
    volumes:
      - seaweedfs_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9333/cluster/healthz"]
      interval: 10s
      timeout: 5s
      retries: 5

  activepieces:
    image: activepieces/activepieces:latest
    container_name: customs-activepieces
    restart: unless-stopped
    environment:
      AP_DB_TYPE: POSTGRES
      AP_POSTGRES_HOST: postgres
      AP_POSTGRES_PORT: 5432
      AP_POSTGRES_DATABASE: activepieces
      AP_POSTGRES_USERNAME: ${POSTGRES_USER:-customs}
      AP_POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      AP_REDIS_HOST: redis
      AP_REDIS_PORT: 6379
      AP_REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
      AP_JWT_SECRET: ${AP_JWT_SECRET:?AP_JWT_SECRET is required}
      AP_ENCRYPTION_KEY: ${AP_ENCRYPTION_KEY:?AP_ENCRYPTION_KEY is required}
      AP_FRONTEND_URL: https://${PUBLIC_HOST:-localhost}:8080
      AP_SIGN_UP_ENABLED: "true"
      AP_ALLOW_SIGN_UP: "true"
      ENVIRONMENT: "DEVELOPMENT"

    ports:
      - "8081:80"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  backend:
    build: ./backend
    image: customs-saas-backend:hotfix
    container_name: customs-backend
    restart: unless-stopped
    environment:
      HTTP_PROXY: http://host.docker.internal:7890
      HTTPS_PROXY: http://host.docker.internal:7890
      NO_PROXY: localhost,127.0.0.1,postgres,redis,seaweedfs,ocr,backend,bots
      NODE_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER:-customs}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@postgres:5432/${POSTGRES_DB:-customs_saas}
      REDIS_URL: redis://:${REDIS_PASSWORD:?REDIS_PASSWORD is required}@redis:6379
      MINIO_ENDPOINT: seaweedfs
      MINIO_PORT: 8333
      MINIO_ACCESS_KEY: ${MINIO_USER:?MINIO_USER is required}
      MINIO_SECRET_KEY: ${MINIO_PASSWORD:?MINIO_PASSWORD is required}
      JWT_SECRET: "${JWT_SECRET:?JWT_SECRET is required. Generate: openssl rand -base64 48}"
      OCR_SERVICE_URL: http://ocr:8002

      ALIYUN_OCR_ACCESS_KEY_ID: ${ALIYUN_OCR_ACCESS_KEY_ID:-}

      ALIYUN_OCR_ACCESS_KEY_SECRET: ${ALIYUN_OCR_ACCESS_KEY_SECRET:-}
      CORS_ORIGIN: ${CORS_ORIGIN:-https://${PUBLIC_HOST:-your-domain.com}}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      PIPELINE_QUEUE_ENABLED: 'true'
      WECHAT_APP_ID: ${WECHAT_APP_ID:-}
      WECHAT_MCH_ID: ${WECHAT_MCH_ID:-}
      WECHAT_API_KEY: ${WECHAT_API_KEY:-}
      ALIPAY_APP_ID: ${ALIPAY_APP_ID:-}
      ALIPAY_PRIVATE_KEY: ${ALIPAY_PRIVATE_KEY:-}
      ALIPAY_PUBLIC_KEY: ${ALIPAY_PUBLIC_KEY:-}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_FROM: ${SMTP_FROM:-noreply@customs-saas.com}
      PUBLIC_HOST: ${PUBLIC_HOST:-localhost}
    command: ["sh", "-c", "npm start"]
    volumes:
      - ./backend/dist:/app/dist
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      seaweedfs:
        condition: service_healthy

  ocr:
    build: ./ocr_service
    container_name: customs-ocr
    restart: unless-stopped
    expose:
      - "8002"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8002/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  bots:
    build: ./bots
    container_name: customs-bots
    restart: unless-stopped
    environment:
      HTTP_PROXY: http://host.docker.internal:7890
      HTTPS_PROXY: http://host.docker.internal:7890
      NO_PROXY: localhost,127.0.0.1,backend
      BACKEND_API_URL: http://backend:3000
      FEISHU_WEBHOOK_URL: ${FEISHU_WEBHOOK_URL:-}
      FEISHU_APP_SECRET: ${FEISHU_APP_SECRET:-}
      DINGTALK_WEBHOOK_URL: ${DINGTALK_WEBHOOK_URL:-}
      DINGTALK_APP_SECRET: ${DINGTALK_APP_SECRET:-}
    expose:
      - "8001"
    depends_on:
      - backend

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    container_name: customs-frontend
    restart: unless-stopped
    environment:
      PUBLIC_HOST: ${PUBLIC_HOST:-localhost}
    ports:
      - "8080:80"
    depends_on:
      - backend
    volumes:
      - ./frontend/dist:/usr/share/nginx/html

volumes:
  postgres_data:
  redis_data:
  seaweedfs_data:
