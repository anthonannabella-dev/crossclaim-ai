# ============================================================
# 生产环境 Docker Compose 配置
# 与 docker-compose.yml 差异:
#   - 资源限制 (CPU/内存)
#   - 日志轮转限制
#   - 健康检查
#   - 后端端口绑定 127.0.0.1 (不绕过 Nginx)
#   - 生产级 SSL 配置
# ============================================================
services:
  postgres:
    image: postgres:16-alpine
    container_name: customs-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: \${POSTGRES_USER:-customs}
      POSTGRES_PASSWORD: \${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: \${POSTGRES_DB:-customs_saas}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/init.sql:/docker-entrypoint-initdb.d/init.sql
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "1.0"
        reservations:
          memory: 256M
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U customs -d customs_saas"]
      interval: 10s
      timeout: 5s
      retries: 5
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  redis:
    image: redis:7-alpine
    container_name: customs-redis
    restart: unless-stopped
    command: redis-server --requirepass \${REDIS_PASSWORD:?REDIS_PASSWORD is required} --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data
    deploy:
      resources:
        limits:
          memory: 384M
          cpus: "0.5"
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "\${REDIS_PASSWORD:?REDIS_PASSWORD is required}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  seaweedfs:
    image: chrislusf/seaweedfs:latest
    container_name: customs-seaweedfs
    restart: unless-stopped
    command: server -s3 -s3.port=8333 -dir=/data -volume.max=0
    ports:
      - "127.0.0.1:8333:8333"
      - "127.0.0.1:9333:9333"
    volumes:
      - seaweedfs_data:/data
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: "0.5"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9333/cluster/healthz"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  activepieces:
    image: activepieces/activepieces:latest
    container_name: customs-activepieces
    restart: unless-stopped
    environment:
      AP_DB_TYPE: POSTGRES
      AP_POSTGRES_HOST: postgres
      AP_POSTGRES_PORT: 5432
      AP_POSTGRES_DATABASE: activepieces
      AP_POSTGRES_USERNAME: \${POSTGRES_USER:-customs}
      AP_POSTGRES_PASSWORD: \${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      AP_REDIS_HOST: redis
      AP_REDIS_PORT: 6379
      AP_REDIS_PASSWORD: \${REDIS_PASSWORD:?REDIS_PASSWORD is required}
      AP_JWT_SECRET: \${AP_JWT_SECRET:?AP_JWT_SECRET is required}
      AP_ENCRYPTION_KEY: \${AP_ENCRYPTION_KEY:?AP_ENCRYPTION_KEY is required}
      AP_FRONTEND_URL: https://\${PUBLIC_HOST:-localhost}
      AP_PRODUCTION: "true"
    expose:
      - "8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "1.0"
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  backend:
    build: ./backend
    container_name: customs-backend
    restart: unless-stopped
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://\${POSTGRES_USER}:***@postgres:5432/\${POSTGRES_DB:-customs_saas}
      REDIS_URL: redis://:\${REDIS_PASSWORD:?REDIS_PASSWORD is required}@redis:6379
      MINIO_ENDPOINT: seaweedfs
      MINIO_PORT: 8333
      MINIO_ACCESS_KEY: \${MINIO_USER:?MINIO_USER is required}
      MINIO_SECRET_KEY: \${MINIO_PASSWORD:?MINIO_PASSWORD is required}
      JWT_SECRET: "\${JWT_SECRET:?JWT_SECRET is required. Generate: openssl rand -base64 48}"
      OCR_SERVICE_URL: http://ocr:8002
      CORS_ORIGIN: \${CORS_ORIGIN:-https://\${PUBLIC_HOST:-your-domain.com}}
      DEEPSEEK_API_KEY: \${DEEPSEEK_API_KEY:-}
      SMTP_HOST: \${SMTP_HOST:-}
      SMTP_PORT: \${SMTP_PORT:-587}
      SMTP_USER: \${SMTP_USER:-}
      SMTP_PASS: \${SMTP_PASS:-}
      SMTP_FROM: \${SMTP_FROM:-noreply@customs-saas.com}
      PUBLIC_HOST: \${PUBLIC_HOST:-localhost}
      FEISHU_WEBHOOK_URL: \${FEISHU_WEBHOOK_URL:-}
      WECOM_WEBHOOK_URL: \${WECOM_WEBHOOK_URL:-}
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      seaweedfs:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: "2.0"
        reservations:
          memory: 512M
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "5"

  ocr:
    build: ./ocr_service
    container_name: customs-ocr
    restart: unless-stopped
    environment:
      - OCR_WORKERS=2
    ports:
      - "127.0.0.1:8002:8002"
    volumes:
      - ocr_cache:/app/cache
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: "1.0"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8002/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  hs-query-frontend:
    build: ./hs-query-frontend
    container_name: customs-hs-query
    restart: unless-stopped
    ports:
      - "127.0.0.1:3001:3001"
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: "0.5"
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  nginx:
    build: ./nginx
    container_name: customs-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - nginx_ssl:/etc/nginx/certs
    depends_on:
      backend:
        condition: service_started
    deploy:
      resources:
        limits:
          memory: 128M
          cpus: "0.3"
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  bot-worker:
    build: ./bots
    container_name: customs-bot-worker
    restart: unless-stopped
    environment:
      NODE_ENV: production
      BOT_WORKER_CONCURRENCY: 3
    deploy:
      replicas: 1
      resources:
        limits:
          memory: 256M
          cpus: "0.5"
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"


  # ========== 监控 ==========
  prometheus:
    image: prom/prometheus:latest
    container_name: customs-prometheus
    restart: unless-stopped
    volumes:
      - ./docker/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    ports:
      - "127.0.0.1:9090:9090"
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "0.5"
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  grafana:
    image: grafana/grafana:latest
    container_name: customs-grafana
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_INSTALL_PLUGINS: grafana-piechart-panel
    volumes:
      - grafana_data:/var/lib/grafana
    ports:
      - "127.0.0.1:3002:3000"
    depends_on:
      - prometheus
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: "0.3"
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  prometheus_data:
    driver: local
  grafana_data:
    driver: local
